[project]
name = "scan2print"
version = "0.0.1"
description = "Phase 0 spike: mesh print-prep and dimensional-accuracy evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.4",
    "manifold3d>=2.5",
    "networkx>=3.0",
    "lxml>=5.0",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# GPU reconstruction (Colab / NVIDIA). CPU-only pycolmap cannot run the dense step.
recon = ["pycolmap-cuda12==4.2.1"]

[project.scripts]
scan2print = "scan2print.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scan2print"]

[tool.pytest.ini_options]
testpaths = ["tests"]
